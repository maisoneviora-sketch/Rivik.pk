<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rivek Watches</title>
<style>
:root{--g:#f2f2f2;--m:#6b6b6b;--l:#d9d9d9}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 "Helvetica Neue",Arial,sans-serif;color:#000;background:#fff}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #888;outline-offset:2px}
img{max-width:100%;display:block}
.logo{height:24px;width:auto}
.btn{background:#000;color:#fff;border:1px solid #000;padding:11px 20px;cursor:pointer;font-weight:600;letter-spacing:.02em}
.btn:hover{background:#222}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.o{background:transparent;color:inherit;border-color:currentColor}.btn.o:hover{background:rgba(128,128,128,.2)}
.btn.s{padding:6px 12px;font-size:13px}.btn.r{color:#b00020;border-color:#b00020;background:#fff}
.mut{color:var(--m);font-size:13px}
header{background:#000;color:#fff;position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:12px 20px;flex-wrap:wrap}
header form{flex:1;min-width:180px;order:3;max-width:520px;margin:0 auto}
header input{width:100%;padding:9px 14px;border:1px solid #444;background:#111;color:#fff;border-radius:0}
header .sp{flex:1}
.hero{background:#000;color:#fff;text-align:center;padding:72px 20px 64px}
.hero .logo{height:auto;width:min(520px,84%);margin:0 auto 28px}
.hero p{font-size:18px;max-width:460px;margin:0 auto 28px;color:#ccc}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid #000}
.cats button{background:#fff;border:0;border-right:1px solid #000;padding:34px 8px;font-size:clamp(18px,4vw,34px);font-weight:800;cursor:pointer;letter-spacing:-.01em}
.cats button:last-child{border:0}.cats button:hover{background:#000;color:#fff}
main{max-width:1200px;margin:0 auto;padding:36px 20px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.chip{border:1px solid #000;background:#fff;padding:7px 18px;cursor:pointer;font-weight:600}
.chip.on{background:#000;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px}
.card{min-width:0;width:100%;overflow:hidden}.card .im{width:100%;aspect-ratio:4/5}.card h3{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}.card .mut{display:block}.card b{display:inline-block;margin-top:5px}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:360px){.grid{gap:16px 10px}.card h3{font-size:13px}}
.card{cursor:pointer;text-align:left;background:none;border:0;padding:0}
.card .im,.pi{aspect-ratio:4/5;background:var(--g);overflow:hidden;position:relative}
.im img,.pi img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;background:#000 var(--logo) center/55% no-repeat}
.card h3{font-size:15px;margin-top:10px}.card:hover h3{text-decoration:underline}
.tag{position:absolute;top:8px;left:8px;background:#000;color:#fff;font-size:12px;padding:2px 8px}
.empty{padding:70px 10px;text-align:center;color:var(--m);border:1px dashed var(--l)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.box{background:#fff;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:26px;position:relative}
.box>.x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:28px;cursor:pointer;line-height:1}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.pd .pi{border:1px solid var(--l);border-radius:4px}.pd .pi img{object-fit:contain}.pd .pr{font-size:25px}.pd .buybar{position:sticky;bottom:0;background:#fff;padding:12px 0 0;border-top:1px solid var(--l)}.pd .btn{flex:1;min-width:120px}
.pr{font-size:22px;font-weight:700;margin:6px 0}.ds{white-space:pre-line;margin:12px 0}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.qi{width:76px;padding:10px;border:1px solid #000}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
.f{width:100%;padding:10px;border:1px solid #999;background:#fff}
.dr{position:fixed;right:0;top:0;bottom:0;width:min(430px,100%);background:#fff;z-index:50;padding:20px;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.3)}
.dr .li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--l)}
.dr .li .t{width:64px;height:80px;flex:none;background:var(--g)}.t img{height:100%;width:100%;object-fit:cover}
.dr .ls{flex:1;overflow:auto}.qb{display:inline-flex;align-items:center;border:1px solid #000}
.qb button{border:0;background:#fff;width:28px;height:28px;cursor:pointer}.qb span{min-width:26px;text-align:center}
.sum{display:flex;justify-content:space-between;padding:4px 0}.sum.tot{font-weight:800;font-size:18px;border-top:1px solid #000;margin-top:6px;padding-top:10px}
#adm{position:fixed;inset:0;background:#fff;z-index:55;display:flex;flex-direction:column;overflow:hidden;max-width:100vw}
.ah{background:#000;color:#fff;padding:10px 16px;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;flex:none;width:100%;min-width:0}
.as{flex:1 1 auto;min-height:0;width:100%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.at{display:flex;gap:8px;min-width:0;flex-wrap:wrap}.ax{display:flex;gap:8px;margin-left:auto;flex:none}
.tw{max-width:100%;overflow-x:auto}.mc{display:none}
@media(max-width:640px){.ah{padding:8px 12px}.at{order:3;flex:1 1 100%;flex-wrap:nowrap}.at .btn{flex:1 1 0;min-width:0;padding:7px 4px;font-size:12px}.hc{display:none}.mc{display:block}.ab td{padding:8px 4px}.ab td.na .btn{display:block;width:100%;margin:3px 0}.tb{width:44px;height:55px}}
.ah .sp{flex:1}.ab{max-width:1000px;margin:0 auto;padding:24px 16px 60px;overflow-wrap:anywhere;min-width:0}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--l);text-align:left;vertical-align:middle}
.tb{width:52px;height:64px;background:var(--g)}.tb img{width:100%;height:100%;object-fit:cover}
.oc{border:1px solid #000;padding:16px;margin-bottom:16px}
.oh{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;border-bottom:1px solid var(--l);padding-bottom:10px;margin-bottom:10px}
.st{padding:3px 10px;font-weight:700;font-size:12px;border:1px solid #000}.st.Pending{background:#fff}.st.Confirmed,.st.Shipped{background:#ddd}.st.Delivered{background:#000;color:#fff}.st.Cancelled{text-decoration:line-through;color:var(--m)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:11px 20px;z-index:99;display:none;max-width:90%;border:1px solid #fff}
footer{background:#000;color:#aaa;text-align:center;padding:26px 14px;font-size:13px}footer .logo{margin:0 auto 10px;height:18px}
.gal{min-width:0}.gv{touch-action:pan-y pinch-zoom}
.gt{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.gt::-webkit-scrollbar{display:none}
.gs{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always}
.gn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:24px;line-height:1;cursor:pointer;z-index:2}.gp{left:8px}.gx{right:8px}
.gc{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:2px 8px;z-index:2}
.gth{display:flex;gap:8px;margin-top:10px;overflow-x:auto;position:relative;padding-bottom:4px;scrollbar-width:thin}
.gb{flex:0 0 58px;width:58px;aspect-ratio:4/5;padding:0;border:2px solid var(--l);background:var(--g);cursor:pointer;overflow:hidden}.gb.on{border-color:#000}.gb img{width:100%;height:100%;object-fit:cover}
@media(hover:none) and (pointer:coarse){.gn{display:none}}
.ieg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.ie{min-width:0;border:1px solid var(--l);padding:6px}.ieb{position:relative;aspect-ratio:4/5;background:var(--g);overflow:hidden}.ieb img{width:100%;height:100%;object-fit:cover}
.iea{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}.iea .btn{padding:6px 2px;font-size:12px;min-width:0}
.pst{margin-top:10px;font-size:13px;min-height:1em}.pst.er{color:#b00020;font-weight:600}
@media(max-width:640px){.pd,.g2{grid-template-columns:1fr}.pd .pi{max-height:44vh}.pd .pi img{object-fit:contain}.hero{padding:48px 16px}.box{padding:20px 16px}.rh{display:none}}
@media(prefers-reduced-motion:no-preference){.ov{animation:f .15s}@keyframes f{from{opacity:0}}}
</style></head><body>

<section class="hero"><img class="logo" alt="Rivek Watches" data-logo><p>Premium watches. Cash on delivery.</p><button class="btn o" style="color:#fff" data-a="shop">Shop now</button></section>
<nav class="cats"><button data-a="cat" data-i="Watches">Watches</button><button data-a="cat" data-i="Western Dressing">Western Dressing</button></nav>
<main id="shop"><div class="bar" id="bar"></div><div id="grid"></div></main>
<footer><img class="logo" alt="Rivek Watches" data-logo>&copy; <span id="yr"></span> Rivek Watches. All rights reserved.</footer>
<div id="layer"></div><div id="toast" role="status"></div>
